name: Tests

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Run integration tests
        run: python project-handoff/tests/run_checks.py --report test-results.json
